<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a4d2e"/>
      <stop offset="100%" style="stop-color:#2d6a4f"/>
    </linearGradient>
  </defs>
  <!-- Fondo -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Billete/Dinero estilizado -->
  <rect x="80" y="160" width="352" height="192" rx="20" fill="#fff" opacity="0.95"/>
  <rect x="100" y="180" width="312" height="152" rx="12" fill="none" stroke="#1a4d2e" stroke-width="4"/>
  <!-- Signo $ central -->
  <text x="256" y="290" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="#1a4d2e" text-anchor="middle">$</text>
  <!-- Círculos decorativos -->
  <circle cx="140" cy="256" r="25" fill="none" stroke="#1a4d2e" stroke-width="3"/>
  <circle cx="372" cy="256" r="25" fill="none" stroke="#1a4d2e" stroke-width="3"/>
  <!-- Texto SYA -->
  <text x="256" y="420" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#fff" text-anchor="middle">SYA</text>
</svg>
